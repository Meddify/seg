<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Team</title>
  <link rel="stylesheet" href="team.css" />
</head>
<body>

  <nav class="nav" aria-label="main navigation">
    <a href="index.html">Home</a>
    <a href="ProductFeatures.html">Product</a>
    <a href="team.html" aria-current="page">Our Team</a>
    <a href="pricingpage.html">Pricing</a>
    <a href="contactus.html">Contact Us</a>
    <a href="signup.html">Sign Up</a>
  </nav>

  <header>
    <h1>Meet the Team</h1>
    <p class="subtitle">
      The minds behind Meddify — our project for better digital health.
    </p>
  </header>

  <main class="team-container" id="team"></main>

  <div class="modal" id="member-modal" aria-hidden="true">
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-dialog">
      <button class="modal-close" type="button">×</button>
      <div class="modal-initial-badge" id="modal-initials"></div>
      <h2 class="modal-name" id="modal-name"></h2>
      <p class="modal-role" id="modal-role"></p>
      <p class="modal-bio" id="modal-bio"></p>
    </div>
  </div>

  <footer class="footer">© 2025 Meddify</footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const team = [
        { 
          name: "Sarah Abada",
          role: "Front-end & Accessibility",
          bio: "Focuses on the HTML and CSS, making sure the pages look consistent, readable, and accessible across the site."
        },
        { 
          name: "Celine Arakji",
          role: "UI/UX & Visual Design",
          bio: "Designs the page layouts, chooses colors and typography, and helps keep the experience clear and user-friendly."
        },
        { 
          name: "Rosesh Baniya",
          role: "Development & Testing",
          bio: "Implements features, links the pages together, and helps test that everything works the way it should."
        },
        { 
          name: "Hachem Chamas",
          role: "System Logic & Structure",
          bio: "Thinks about how the different parts of the website fit together and supports with small JavaScript logic when needed."
        },
        { 
          name: "Aimee Ganza",
          role: "Research & Content",
          bio: "Works on understanding user needs, writes and edits content, and helps make the text clear for our audience."
        },
        { 
          name: "Rishi V.",
          role: "Business & Pricing",
          bio: "Helps design the pricing plans, considers how Meddify could grow as a product, and supports with documentation."
        }
      ];

      const container = document.getElementById("team");

      function getInitials(name) {
        const parts = name.trim().split(/\s+/);
        if (parts.length === 1) return parts[0][0]?.toUpperCase() || "";
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      // Render cards
      team.forEach(member => {
        const card = document.createElement("div");
        card.className = "member";
        card.dataset.name = member.name;

        card.innerHTML = `
          <div class="initial-badge">${getInitials(member.name)}</div>
          <div class="member-name">${member.name}</div>
          <div class="member-role">${member.role}</div>
        `;

        container.appendChild(card);
      });

      // Modal logic
      const modal = document.getElementById("member-modal");
      const initials = document.getElementById("modal-initials");
      const mName = document.getElementById("modal-name");
      const mRole = document.getElementById("modal-role");
      const mBio = document.getElementById("modal-bio");
      const mClose = document.querySelector(".modal-close");

      function openModal(member) {
        initials.textContent = getInitials(member.name);
        mName.textContent = member.name;
        mRole.textContent = member.role;
        mBio.textContent = member.bio;
        modal.classList.add("show");
      }

      function closeModal() {
        modal.classList.remove("show");
      }

      container.addEventListener("click", (e) => {
        const card = e.target.closest(".member");
        if (!card) return;
        const person = team.find(x => x.name === card.dataset.name);
        if (person) openModal(person);
      });

      mClose.addEventListener("click", closeModal);

      modal.addEventListener("click", (e) => {
        if (e.target.classList.contains("modal-backdrop")) {
          closeModal();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("show")) {
          closeModal();
        }
      });
    });
  </script>
</body>
</html>
